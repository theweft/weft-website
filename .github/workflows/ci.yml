name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an expiring security.txt fails CI before it expires.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to commit SHAs before the first release (OpenSSF Scorecard); Dependabot keeps them current.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command just ci
